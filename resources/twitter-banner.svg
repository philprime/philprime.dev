  </defs>
  <rect width="1500" height="500" fill="#181818" />
  <rect width="1500" height="500" fill="url(#glow-left)" />
  <rect width="1500" height="500" fill="url(#glow-center)" />
  <rect width="1500" height="500" fill="url(#glow-right)" />
  <rect width="1500" height="500" fill="url(#glow-corner)" />
  <rect width="1500" height="500" fill="url(#grid)" />
  <g font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="750" y="264" fill="#f5f5f5" font-size="98" font-weight="600" letter-spacing="-4">
