      <stop offset="0" stop-color="#3683ce" stop-opacity="0.17" />
      <stop offset="0.5" stop-color="#3683ce" stop-opacity="0.07" />
      <stop offset="1" stop-color="#3683ce" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-center" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
      gradientTransform="translate(770 25) scale(610 310)">
      <stop offset="0" stop-color="#79b8ff" stop-opacity="0.13" />
      <stop offset="0.5" stop-color="#79b8ff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#79b8ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
      gradientTransform="translate(1150 315) scale(600 310)">
      <stop offset="0" stop-color="#3683ce" stop-opacity="0.17" />
      <stop offset="0.5" stop-color="#3683ce" stop-opacity="0.07" />
      <stop offset="1" stop-color="#3683ce" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-corner" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
